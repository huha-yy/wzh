server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tools_sharing?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
    username: root
    password: 123666888
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  sql:
    init:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration
logging:
  file:
    name: logs/app.log
  level:
